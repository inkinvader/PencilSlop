<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 620" width="512" height="620" role="img" aria-labelledby="title">
  <title id="title">PENCILSLOP logo: a giant pencil stabbed into a robot head</title>

  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="620" rx="48" fill="#F1ECE2"/>

  <!-- Artwork group, scaled about the centre so the pencil fits the tile -->
  <g transform="translate(256 270) scale(0.85) translate(-256 -270)">

  <!-- Robot: antenna, ears, head -->
  <g stroke="#2A1A12" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <line x1="215" y1="200" x2="215" y2="150"/>
    <circle cx="215" cy="138" r="16" fill="#A3192B"/>
    <rect x="120" y="270" width="34" height="70" rx="10" fill="#9AA6B8"/>
    <rect x="386" y="270" width="34" height="70" rx="10" fill="#9AA6B8"/>
    <rect x="150" y="200" width="240" height="220" rx="36" fill="#C9D3E0"/>

    <!-- Eyes, mirrored about the head's centre (x 270): knocked-out X on the
         left (x 210), and on the right (x 330) an empty socket the pencil is stabbed into -->
    <line x1="190" y1="262" x2="230" y2="302"/>
    <line x1="230" y1="262" x2="190" y2="302"/>
    <circle cx="330" cy="282" r="30" fill="#2A1A12"/>

  </g>

  <!-- Teeth: five separate white teeth -->
  <g fill="#FFFFFF" stroke="#2A1A12" stroke-width="6" stroke-linejoin="round">
    <rect x="190" y="340" width="28" height="44" rx="7"/>
    <rect x="223" y="340" width="28" height="44" rx="7"/>
    <rect x="256" y="340" width="28" height="44" rx="7"/>
    <rect x="289" y="340" width="28" height="44" rx="7"/>
    <rect x="322" y="340" width="28" height="44" rx="7"/>
  </g>

  <!-- Pencil: drawn along +x from the socket's centre, then rotated so it sticks
       up-right out of the right eye. Its front half (tip and wood) is buried in
       the socket, so only the shaft, ferrule and eraser show. -->
  <defs>
    <radialGradient id="socket-depth">
      <stop offset="0" stop-color="#2A1A12" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#2A1A12" stop-opacity="1"/>
      <stop offset="1" stop-color="#2A1A12" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <g transform="translate(330 282) rotate(-55)" stroke="#2A1A12" stroke-width="8" stroke-linejoin="round">
    <rect x="-8" y="-26" width="204" height="52" fill="#C9A045"/>
    <line x1="-8" y1="-9" x2="196" y2="-9" stroke="#9C7A2E" stroke-width="5"/>
    <line x1="-8" y1="9" x2="196" y2="9" stroke="#9C7A2E" stroke-width="5"/>
    <rect x="196" y="-26" width="24" height="52" fill="#B8C0CC"/>
    <rect x="220" y="-26" width="32" height="52" rx="10" fill="#C9505C"/>
  </g>
  <!-- Socket over the pencil: darkening toward the centre, crisp rim -->
  <circle cx="330" cy="282" r="30" fill="url(#socket-depth)"/>
  <circle cx="330" cy="282" r="30" fill="none" stroke="#2A1A12" stroke-width="8"/>

  </g>

  <!-- Wordmark: PENCIL in pencil-yellow, SLOP in robot-grey -->
  <text x="256" y="548" text-anchor="middle"
        font-family="'Arial Black', 'Arial Rounded MT Bold', Arial, sans-serif"
        font-weight="900" font-size="58" letter-spacing="1"
        stroke="#2A1A12" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
    <tspan fill="#C9A045">PENCIL</tspan><tspan fill="#C9D3E0">SLOP</tspan>
  </text>
</svg>
